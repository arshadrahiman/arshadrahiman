<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abdullah Arshadul Rahman - Senior Flutter and Full-Stack Engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220">
        <animate attributeName="stop-color" values="#0b1220;#0f172a;#0b1220" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#1e3a8a">
        <animate attributeName="stop-color" values="#1e3a8a;#312e81;#1e3a8a" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0ea5e9">
        <animate attributeName="stop-color" values="#0ea5e9;#06b6d4;#0ea5e9" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- moving glows -->
    <circle cx="200" cy="80" r="220" fill="url(#glow)">
      <animate attributeName="cx" values="200;420;200" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;160;80" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="240" r="260" fill="url(#glow)">
      <animate attributeName="cx" values="1000;800;1000" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="240;120;240" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- floating particles -->
    <g fill="#ffffff">
      <circle cx="120" cy="250" r="3" opacity="0.5"><animate attributeName="cy" values="260;40;260" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="270" r="2" opacity="0.4"><animate attributeName="cy" values="280;30;280" dur="11s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="260" r="3" opacity="0.4"><animate attributeName="cy" values="270;50;270" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="275" r="2" opacity="0.5"><animate attributeName="cy" values="285;20;285" dur="13s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="255" r="3" opacity="0.4"><animate attributeName="cy" values="265;45;265" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="270" r="2" opacity="0.5"><animate attributeName="cy" values="280;35;280" dur="12s" repeatCount="indefinite"/></circle>
    </g>

    <!-- code brackets decoration -->
    <text x="70" y="190" font-family="Consolas, 'Courier New', monospace" font-size="150" fill="#ffffff" opacity="0.06">{</text>
    <text x="1060" y="190" font-family="Consolas, 'Courier New', monospace" font-size="150" fill="#ffffff" opacity="0.06">}</text>

    <!-- text -->
    <text x="600" y="125" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="url(#title)" letter-spacing="1">
      Abdullah Arshadul Rahman
      <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
    </text>
    <text x="600" y="172" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#e0f2fe" letter-spacing="3">
      SENIOR FLUTTER &amp; FULL-STACK ENGINEER
      <animate attributeName="opacity" values="0;1" begin="0.5s" dur="1.4s" fill="freeze"/>
    </text>
    <text x="600" y="214" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#7dd3fc">
      Mobile &#183; Backend &#183; Security &#183; Automation
      <animate attributeName="opacity" values="0;1" begin="1s" dur="1.4s" fill="freeze"/>
    </text>

    <!-- animated wave -->
    <path d="M0 262 Q 150 232 300 262 T 600 262 T 900 262 T 1200 262 T 1500 262 V300 H0 Z" fill="#ffffff" opacity="0.08">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M0 276 Q 150 252 300 276 T 600 276 T 900 276 T 1200 276 T 1500 276 V300 H0 Z" fill="#ffffff" opacity="0.12">
      <animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
